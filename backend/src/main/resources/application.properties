# ==============================================================================
# Digital Krishi Officer - Java Spring Boot Backend Configuration
# Subject: Object-Oriented Programming (OOP) using Java
# ==============================================================================

# Dynamic port for Render deployment (Render sets PORT env variable)
server.port=${PORT:8080}
spring.application.name=digital-krishi-officer-backend

# Database Configuration: Auto-switches to PostgreSQL on Render or H2 in-memory locally
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:mem:krishidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Swagger / OpenAPI Documentation (View at /swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# AI & External API Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.model=gemini-1.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
