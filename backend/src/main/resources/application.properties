# ==============================================================================
# Digital Krishi Officer - Java Spring Boot Backend Configuration
# Subject: Object-Oriented Programming (OOP) using Java
# ==============================================================================

# Dynamic port and host binding for Render & Cloud deployment
server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=digital-krishi-officer-backend

# Safe default database configuration (DatabaseConfig handles dynamic PostgreSQL / Render DATABASE_URL conversion)
spring.datasource.url=jdbc:h2:mem:krishidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Swagger / OpenAPI Documentation (View at /swagger-ui.html)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# AI & External API Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.model=gemini-1.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models

# Weather API Configuration (OpenWeatherMap)
weather.api.key=${WEATHER_API_KEY:671d789ae40566e427e7762d4d80fa58}
weather.api.base-url=https://api.openweathermap.org/data/2.5

